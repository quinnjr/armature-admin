[package]
name = "armature-admin"
version = "0.4.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-admin"
homepage = "https://quinnjr.github.io/armature"
description = "Auto-generated CRUD admin dashboard for Armature framework"
keywords = ["admin", "dashboard", "crud", "ui", "generator"]
categories = ["web-programming", "gui"]

[dependencies]
armature-core = { version = "0.9" }
armature-log = { version = "0.2" }
armature-proc-macro = { version = "0.4" }
tokio = { version = "1.52", features = ["rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.2"
parking_lot = "0.12"
bytes = "1.12"

# HTML templating
askama = { version = "0.16" }

# For form handling
validator = { version = "0.20", features = ["derive"] }

[features]
default = []

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"

